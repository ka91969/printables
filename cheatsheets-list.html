	<script>
	// ---- Site-wide live search (shared/identical across index.html, notebooks.html, cheatsheets.html) ----
	(function () {
		var toggleBtn   = document.querySelector('.search-toggle');
		var searchBox   = document.querySelector('.search-box');   // this IS the <form>
		var searchInput = document.querySelector('.search-input');
		var tabsNav     = document.querySelector('.tabs');
		var tabContent  = document.querySelector('.tab-content');
		var panes       = document.querySelectorAll('[data-tab-content]');
		var rows        = document.querySelectorAll('.tab-content .row');
		var noResultsEl = null;
		var clearBtn    = null;

		if (!searchInput) return; // safety guard, page has no search field

		// Toggle the search field open/closed (works even if plugins.js isn't present)
		if (toggleBtn && searchBox) {
			toggleBtn.addEventListener('click', function (e) {
				e.preventDefault();
				var isOpen = searchBox.classList.toggle('active');
				searchBox.style.display = isOpen ? 'flex' : '';
				if (isOpen) searchInput.focus();
			});
		}

		// Never let the empty GET form actually navigate/reload the page
		if (searchBox && searchBox.tagName === 'FORM') {
			searchBox.addEventListener('submit', function (e) { e.preventDefault(); });
		}

		// Small inline "clear" (x) button inside the search field
		if (searchBox) {
			clearBtn = document.createElement('span');
			clearBtn.textContent = '\u2715';
			clearBtn.setAttribute('aria-label', 'Clear search');
			clearBtn.className = 'search-clear-btn';
			clearBtn.style.cssText = 'display:none;cursor:pointer;position:absolute;right:10px;top:50%;transform:translateY(-50%);opacity:.6;';
			searchBox.style.position = searchBox.style.position || 'relative';
			searchBox.appendChild(clearBtn);
			clearBtn.addEventListener('click', function () {
				searchInput.value = '';
				runSearch('');
				searchInput.focus();
			});
		}

		function normalize(str) { return (str || '').toLowerCase().trim(); }
		function escapeHtml(str) {
			return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}
		function escapeRegExp(str) {
			return (str || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
		}

		// Wrap every occurrence of `term` in `text` with a highlighted <mark>
		function highlight(text, term) {
			var safeText = escapeHtml(text);
			if (!term) return safeText;
			var re = new RegExp('(' + escapeRegExp(term) + ')', 'ig');
			return safeText.replace(re, '<mark class="search-hit" style="background:#ffe066;color:#111;padding:0 2px;border-radius:2px;font-weight:600;">$1</mark>');
		}

		// Build a search index of every real product card on this page.
		// Note: the template also puts a "product-item" class on the <img> inside
		// each card, so we only keep the wrapping <div class="product-item"> nodes.
		function buildIndex() {
			var items = [];
			document.querySelectorAll('div.product-item').forEach(function (card) {
				var h3   = card.querySelector('h3');
				var span = card.querySelector('figcaption span');
				items.push({
					col:     card.closest('.col-md-3') || card,
					h3El:    h3,
					spanEl:  span,
					title:   h3 ? h3.textContent : '',
					author:  span ? span.textContent : '',
					pane:    card.closest('[data-tab-content]')
				});
			});
			return items;
		}
		var index = buildIndex();

		function ensureNoResultsEl() {
			if (!noResultsEl && tabContent) {
				noResultsEl = document.createElement('p');
				noResultsEl.className = 'search-no-results';
				noResultsEl.style.cssText = 'display:none;text-align:center;padding:2rem 0;width:100%;';
				noResultsEl.textContent = 'No results found.';
				tabContent.parentNode.insertBefore(noResultsEl, tabContent.nextSibling);
			}
			return noResultsEl;
		}

		function resetHighlights() {
			index.forEach(function (item) {
				if (item.h3El) item.h3El.textContent = item.title;
				if (item.spanEl) item.spanEl.textContent = item.author;
			});
		}

		function setCentered(on) {
			rows.forEach(function (row) {
				row.classList.toggle('justify-content-center', !!on);
				row.style.textAlign = on ? 'center' : '';
			});
			if (tabContent) tabContent.style.textAlign = on ? 'center' : '';
		}

		function runSearch(rawQuery) {
			var query = normalize(rawQuery);
			var msg = ensureNoResultsEl();

			if (clearBtn) clearBtn.style.display = query ? 'block' : 'none';

			if (!query) {
				// Restore normal tab behaviour
				resetHighlights();
				setCentered(false);
				index.forEach(function (item) { item.col.style.display = ''; });
				panes.forEach(function (pane) {
					pane.style.display = pane.classList.contains('active') ? '' : 'none';
				});
				if (tabsNav) tabsNav.style.display = '';
				if (msg) msg.style.display = 'none';
				return;
			}

			if (tabsNav) tabsNav.style.display = 'none';
			setCentered(true);

			var matchCount = 0;
			var matchedPaneIds = {};

			index.forEach(function (item) {
				var haystack = normalize(item.title) + ' ' + normalize(item.author);
				var isMatch = haystack.indexOf(query) !== -1;
				item.col.style.display = isMatch ? '' : 'none';

				if (isMatch) {
					matchCount++;
					if (item.pane) matchedPaneIds[item.pane.id] = true;
					if (item.h3El) item.h3El.innerHTML = highlight(item.title, rawQuery.trim());
					if (item.spanEl) item.spanEl.innerHTML = highlight(item.author, rawQuery.trim());
				} else {
					if (item.h3El) item.h3El.textContent = item.title;
					if (item.spanEl) item.spanEl.textContent = item.author;
				}
			});

			panes.forEach(function (pane) {
				pane.style.display = matchedPaneIds[pane.id] ? '' : 'none';
			});

			if (msg) msg.style.display = matchCount === 0 ? 'block' : 'none';

			// Bring the first match into view, centered in the viewport
			if (matchCount > 0) {
				var firstVisible = null;
				for (var i = 0; i < index.length; i++) {
					if (index[i].col.style.display !== 'none') { firstVisible = index[i].col; break; }
				}
				if (firstVisible && firstVisible.scrollIntoView) {
					firstVisible.scrollIntoView({ behavior: 'smooth', block: 'center' });
				}
			}
		}

		var debounceTimer;
		searchInput.addEventListener('input', function () {
			clearTimeout(debounceTimer);
			var val = searchInput.value;
			debounceTimer = setTimeout(function () { runSearch(val); }, 120);
		});
	})();
	</script>

</body>

</html>
